[package]
name = "ai-pocket-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AI Pocket WAN relay server: WebSocket signaling relay + auth for screen-cast hardware"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ai-pocket-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# 发布期改用锁定版：ai-pocket-core = { git = "https://github.com/OpenLoaf/ai-pocket-core", tag = "v0.1.0" }
ai-pocket-core = { path = "../core/crates/core" }
# 发布期改用锁定版：ai-pocket-transport = { git = "https://github.com/OpenLoaf/ai-pocket-core", tag = "v0.1.0" }
ai-pocket-transport = { path = "../core/crates/transport" }
